{% extends 'base.html' %}

{% block bodyblock %}
<div class="max-w-md mx-auto mt-12 animate-in fade-in zoom-in-95 duration-500">
    <div class="glass p-10 rounded-2xl border-t-2 border-fuchsia-500 shadow-2xl">
        
        <div class="text-center mb-8">
            <h2 class="font-orbitron text-fuchsia-400 text-xl font-bold uppercase tracking-[0.2em]">
                Create Profile
            </h2>
            <p class="text-[10px] text-slate-500 font-mono mt-2 uppercase tracking-tighter">
                Biometric Registration // db_enrollment_v2
            </p>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label class="block font-orbitron text-[10px] text-slate-500 uppercase mb-2">New Username</label>
                <input type="text" name="username" 
                       class="w-full bg-slate-900/50 border border-slate-800 rounded-sm p-3 text-fuchsia-400 focus:border-fuchsia-500 outline-none transition-all" 
                       required>
            </div>
            
            <div>
                <label class="block font-orbitron text-[10px] text-slate-500 uppercase mb-2">New Access Key</label>
                <input type="password" name="password" 
                       class="w-full bg-slate-900/50 border border-slate-800 rounded-sm p-3 text-fuchsia-400 focus:border-fuchsia-500 outline-none transition-all" 
                       required>
            </div>

            <button type="submit" 
                    class="w-full py-4 bg-transparent border border-fuchsia-500 text-fuchsia-500 font-orbitron text-xs tracking-[0.3em] hover:bg-fuchsia-500 hover:text-white transition-all shadow-[0_0_15px_rgba(217,70,239,0.2)] uppercase mt-4">
                Create Account
            </button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="/login" class="text-[10px] font-orbitron text-slate-600 hover:text-cyan-400 transition-colors uppercase tracking-widest">
                Existing Operator? Proceed to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
